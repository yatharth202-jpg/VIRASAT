<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="thaliBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#4d2b0e"/>
      <stop offset="50%" stop-color="#2a1404"/>
      <stop offset="100%" stop-color="#120600"/>
    </radialGradient>
    <radialGradient id="brassThali" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffea9f"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="80%" stop-color="#8a6c1e"/>
      <stop offset="100%" stop-color="#473408"/>
    </radialGradient>
    <radialGradient id="baatiGlow" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fff2c2"/>
      <stop offset="40%" stop-color="#e6a843"/>
      <stop offset="80%" stop-color="#a65e17"/>
      <stop offset="100%" stop-color="#5e2e05"/>
    </radialGradient>
    <radialGradient id="dalStew" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffbb33"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="90%" stop-color="#92400e"/>
    </radialGradient>
  </defs>
  
  <rect width="300" height="300" fill="url(#thaliBg)" rx="8"/>
  <circle cx="150" cy="150" r="130" fill="url(#brassThali)"/>
  <circle cx="150" cy="150" r="122" fill="#211206" opacity="0.85"/>
  
  <!-- Katori 1: Panchmel Dal -->
  <g transform="translate(190, 105)">
    <circle cx="0" cy="0" r="38" fill="url(#brassThali)"/>
    <circle cx="0" cy="0" r="34" fill="url(#dalStew)"/>
