    <circle cx="0" cy="0" r="32" fill="#d99849"/>
  </g>
  
  <!-- Golden Baatis -->
  <g transform="translate(115, 185)">
    <circle cx="0" cy="0" r="28" fill="url(#baatiGlow)"/>
    <path d="M-14,-10 Q0,-4 12,-12 M-8,4 Q2,12 14,6" stroke="#3b1702" stroke-width="2.5" fill="none"/>
  </g>
  <g transform="translate(180, 185)">
    <circle cx="0" cy="0" r="28" fill="url(#baatiGlow)"/>
    <path d="M-10,-12 Q2,-2 14,-8 M-12,8 Q-2,4 10,12" stroke="#3b1702" stroke-width="2.5" fill="none"/>
